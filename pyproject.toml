[project]
name = "planloop"
version = "0.1.0"
description = "Acceptance-centric plan-graph agent runtime (v0): spec -> probe -> decompose -> compile -> execute -> verify"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
planloop = "planloop.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["planloop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
